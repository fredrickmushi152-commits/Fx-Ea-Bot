<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX EA Controller Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; max-width: 480px; margin: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00e676; margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-size: 13px; font-weight: 600; color: #b0bec5; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        .btn-start { background-color: #00e676; color: #000; font-weight: bold; width: 100%; padding: 14px; margin-top: 20px; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; font-size: 14px; }
        .btn-stop { background-color: #ff5252; color: #fff; font-weight: bold; width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>FX Bot Controller</h2>
        <form id="bot-form">
            <label>MetaApi Token:</label>
            <input type="password" name="metaapi_token" placeholder="Enter MetaApi Access Token" required>

            <div class="row">
                <div>
                    <label>Platform:</label>
                    <select name="platform">
                        <option value="mt4">MetaTrader 4 (MT4)</option>
                        <option value="mt5">MetaTrader 5 (MT5)</option>
                    </select>
                </div>
                <div>
                    <label>Account ID:</label>
                    <input type="text" name="account_id" placeholder="e.g. 1234567" required>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Password:</label>
                    <input type="password" name="password" placeholder="Account Password" required>
                </div>
                <div>
                    <label>Server Name:</label>
                    <input type="text" name="server" placeholder="e.g. Exness-Real7" required>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Trading Style:</label>
                    <select name="trading_style">
                        <option value="scalping">Scalping (M5 - M15)</option>
                        <option value="intraday">Intraday (H1)</option>
                        <option value="swing">Swing (H4 - D1)</option>
                    </select>
                </div>
                <div>
                    <label>Strategy / Indicator:</label>
                    <select name="strategy">
                        <option value="ema_cross">EMA Crossover (9/21)</option>
                        <option value="rsi_ema">RSI + EMA Filter</option>
                        <option value="macd">MACD Momentum</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Lot Size:</label>
                    <input type="number" step="0.01" name="lot_size" value="0.01" required>
                </div>
                <div>
                    <label>Stop Loss (Pips):</label>
                    <input type="number" name="stop_loss" value="15" required>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Take Profit (Pips):</label>
                    <input type="number" name="take_profit" value="30" required>
                </div>
                <div>
                    <label>Trailing Stop (Pips):</label>
                    <input type="number" name="trailing_stop" value="10" placeholder="0 for off">
                </div>
            </div>

            <button type="submit" class="btn-start">Start EA Bot</button>
        </form>
        <button type="button" class="btn-stop" id="btn-stop">Stop EA Bot</button>
    </div>

    <script>
        document.getElementById('bot-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            try {
                const response = await fetch('/start-bot', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                alert(result.message);
            } catch (err) {
                alert("Error connecting to server.");
            }
        });

        document.getElementById('btn-stop').addEventListener('click', async function() {
            try {
                const response = await fetch('/stop-bot', { method: 'POST' });
                const result = await response.json();
                alert(result.message);
            } catch (err) {
                alert("Error stopping the bot.");
            }
        });
    </script>
</body>
</html>
